# Loki as a single process (monolithic mode) storing everything on local disk.
# To scale later, point `common.storage` at S3/MinIO; nothing else here has to change.
auth_enabled: false # one tenant; no multi-tenancy header needed

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

# How data is laid out on disk. Changing this later requires adding a new entry with a
# future `from` date, never editing the existing one.
schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h # 7 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h

# Retention is enforced by the compactor, which deletes expired chunks.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
